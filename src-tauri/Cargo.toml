[package]
name = "voxctrl-app"
version.workspace = true
edition.workspace = true
default-run = "voxctrl"

[lib]
name = "voxctrl_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "voxctrl"
path = "src/main.rs"

[[bin]]
name = "voxctrl-overlay"
path = "src/overlay.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# UI framework for native overlay
slint = { workspace = true }
i-slint-backend-winit = { workspace = true }

# Tauri 2 core
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell     = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs        = "2"
tauri-plugin-dialog    = "2"
dirs                   = { workspace = true }

# Internal crates
voxctrl-config    = { workspace = true }
voxctrl-routing   = { workspace = true }
voxctrl-hotkeys   = { workspace = true }
voxctrl-audio     = { workspace = true }
voxctrl-inference = { workspace = true }
voxctrl-tts       = { workspace = true }
voxctrl-inject    = { workspace = true }
voxctrl-dbus      = { workspace = true }
voxctrl-mcp       = { workspace = true }
voxctrl-llm       = { workspace = true }

# Runtime and utilities
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }
gtk = { version = "0.18", features = ["v3_24"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["voxctrl-inference/cuda"]
vulkan = ["voxctrl-inference/vulkan"]
# Compiles the Moonshine ONNX speech-to-text backend into the app. Opt-in like
# cuda/vulkan: it pulls in ONNX Runtime (fetched at build time). Without it, a
# "moonshine" backend selection transparently falls back to whisper-cpp.
moonshine = ["voxctrl-inference/moonshine"]
# Compiles the Inflect-Micro-v2 ONNX text-to-speech engine into the app. Opt-in
# for the same reason as moonshine: it pulls in ONNX Runtime. Without it,
# selecting the engine reports that the build lacks it instead of failing
# obscurely. Also needs `espeak-ng` installed at runtime for phonemization.
inflect-micro = ["voxctrl-tts/inflect-micro"]

[dev-dependencies]
tempfile = { workspace = true }
