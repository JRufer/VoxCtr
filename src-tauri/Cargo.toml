[package]
name = "voxctrl-app"
version.workspace = true
edition.workspace = true
default-run = "voxctrl"

[lib]
name = "voxctrl_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "voxctrl"
path = "src/main.rs"

[[bin]]
name = "voxctrl-overlay"
path = "src/overlay.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# UI framework for native overlay
slint = { workspace = true }
i-slint-backend-winit = { workspace = true }

# Tauri 2 core
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-shell     = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs        = "2"
tauri-plugin-dialog    = "2"
dirs                   = { workspace = true }

# Internal crates
voxctrl-config    = { workspace = true }
voxctrl-routing   = { workspace = true }
voxctrl-hotkeys   = { workspace = true }
voxctrl-audio     = { workspace = true }
voxctrl-inference = { workspace = true }
voxctrl-tts       = { workspace = true }
voxctrl-inject    = { workspace = true }
voxctrl-dbus      = { workspace = true }
voxctrl-mcp       = { workspace = true }
voxctrl-llm       = { workspace = true }

# Runtime and utilities
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { workspace = true }
gtk = { version = "0.18", features = ["v3_24"] }
x11rb = { version = "0.13", features = ["shape"] }

[features]
# Both ONNX-backed engines ship by default: selecting them in Settings should
# work in any build, rather than silently falling back (Moonshine) or leaving
# Test TTS disabled (Inflect). They share one ONNX Runtime, so enabling the
# second costs almost nothing once the first is in.
#
# The trade-off is that a default build now links ONNX Runtime, which is
# fetched at build time — so building requires network access to that host.
# Use `--no-default-features --features custom-protocol` for an offline build
# without either engine.
default = ["custom-protocol", "moonshine", "inflect-micro", "voxcpm2"]
custom-protocol = ["tauri/custom-protocol"]
cuda = ["voxctrl-inference/cuda"]
vulkan = ["voxctrl-inference/vulkan"]
# Compiles the Moonshine ONNX speech-to-text backend into the app. On by
# default; without it a "moonshine" backend selection transparently falls back
# to whisper-cpp.
moonshine = ["voxctrl-inference/moonshine"]
# Compiles the Inflect-Micro-v2 ONNX text-to-speech engine into the app. On by
# default; without it, selecting the engine reports that the build lacks it
# instead of failing obscurely. Needs `espeak-ng` installed at runtime for
# phonemization either way.
inflect-micro = ["voxctrl-tts/inflect-micro"]
# Compiles the VoxCPM2 text-to-speech engine into the app, running the model in
# pure Rust through the `voxcpm-rs` (Burn) crate — no Python, no ONNX Runtime.
#
# The GPU backend is the default because VoxCPM2 is a 2B-parameter model: on a
# GPU it generates faster than realtime and returns first audio inside the
# sub-second budget, while the CPU backend is far slower than realtime and is
# only there for machines with no usable GPU. `wgpu` covers Vulkan, Metal and
# DX12, so this needs no vendor-specific SDK at build time.
#
# Use `voxcpm2-cpu` instead of `voxcpm2` for the portable CPU build; enabling
# neither leaves the engine selectable but non-speaking, and the UI says so.
voxcpm2 = ["voxctrl-tts/voxcpm2-wgpu"]
voxcpm2-cpu = ["voxctrl-tts/voxcpm2-cpu"]

[dev-dependencies]
tempfile = { workspace = true }
