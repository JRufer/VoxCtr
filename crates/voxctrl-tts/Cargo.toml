[package]
name = "voxctrl-tts"
version.workspace = true
edition.workspace = true

[dependencies]
voxctrl-config = { workspace = true }
voxctrl-text = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
crossbeam-channel = { workspace = true }
rodio = { workspace = true }
pocket-tts = { workspace = true }
hf-hub = { workspace = true }
# Not the workspace `ort`: that is configured `load-dynamic`, which resolves
# ONNX Runtime at runtime and so needs a system libonnxruntime present. Nothing
# in the workspace provides one, and its absence surfaces as the TTS worker
# dying inside session creation. Use the same self-contained setup as
# `voxctrl-inference`: default features include `download-binaries`, which
# fetches a prebuilt ONNX Runtime at build time and links it in, so the shipped
# binary needs no system library. Building this feature therefore needs network
# access to the ONNX Runtime binary host at compile time; for a fully offline
# build, switch to `default-features = false, features = ["load-dynamic", "std",
# "api-24"]` and ship a libonnxruntime alongside the app.
ort = { version = "2.0.0-rc.12", optional = true }
# Only pulled in by the `breeze-cuda` / `breeze-metal` features, to name a
# candle `Device` for Breeze-TTS-2. pocket-tts builds on the same candle, so
# turning a backend on here turns it on for the model it loads.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }

[features]
default = []
# GPU offload for Breeze-TTS-2. Opt-in because each backend needs its toolchain
# at build time (CUDA needs nvcc and the CUDA libraries; Metal is macOS-only),
# and candle — which pocket-tts runs on — offers no other GPU backend: there is
# no Vulkan path to select. Without one of these the Breeze GPU setting has
# nothing to switch to and synthesis stays on the CPU.
breeze-cuda = ["dep:candle-core", "dep:candle-nn", "candle-core/cuda", "candle-nn/cuda"]
breeze-metal = [
    "dep:candle-core",
    "dep:candle-nn",
    "candle-core/metal",
    "candle-nn/metal",
    "pocket-tts/metal",
]
# Inflect-Micro-v2 neural TTS via ONNX Runtime. Opt-in like `moonshine` on
# voxctrl-inference, and for the same reason: it pulls in ONNX Runtime. The
# eSpeak-NG phoneme frontend is a runtime dependency, checked for before
# synthesis.
inflect-micro = ["dep:ort"]

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = { workspace = true }
