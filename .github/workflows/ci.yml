name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_HTTP_HTTP2: false

jobs:
  # ── Rust compile check ────────────────────────────────────────────────────────
  cargo-check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (arm64). It runs the full-workspace check
        # (same branch as Linux, since runner.os != 'Windows'), so macOS-specific
        # platform code and the whisper.cpp/C++ crates are compile-checked here.
        os: [ubuntu-22.04, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libspeechd-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools \
            pkg-config \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}

      # Full workspace check on Linux (includes voxctrl-inference which needs whisper-rs/C++)
      - name: cargo check (workspace, no features)
        if: runner.os != 'Windows'
        run: cargo check --workspace

      # On Windows, exclude crates that require whisper.cpp C++ compilation
      # (voxctrl-inference, voxctrl-app). Their Rust type-safety is covered by
      # the Linux check above; this job validates Windows-specific platform code
      # in the remaining pure-Rust crates.
      - name: cargo check (workspace excluding C++ crates, Windows)
        if: runner.os == 'Windows'
        run: cargo check --workspace --exclude voxctrl-inference --exclude voxctrl-app

  # ── Unit tests ────────────────────────────────────────────────────────────────
  cargo-test:
    name: cargo test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libspeechd-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools \
            pkg-config \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-linux

      # Run tests for crates that have unit tests and no heavy system deps
      - name: cargo test
        run: cargo test -p voxctrl-config -p voxctrl-routing -p voxctrl-hotkeys -p voxctrl-app

  # ── Frontend type check ───────────────────────────────────────────────────────
  frontend-check:
    name: Frontend type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install

      # svelte-check (Svelte + TypeScript type checking)
      - run: npm run check

      # Frontend unit tests (vitest)
      - run: npm run test:unit
