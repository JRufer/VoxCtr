name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_HTTP_HTTP2: false

jobs:
  # ── Rust compile check ────────────────────────────────────────────────────────
  cargo-check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libspeechd-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools \
            pkg-config \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}

      # Full workspace check on Linux (includes voxctrl-inference which needs
      # whisper-rs/C++). Default features include the two ONNX-backed engines,
      # so this also fetches ONNX Runtime at build time and needs network access.
      - name: cargo check (workspace, default features)
        if: runner.os != 'Windows'
        run: cargo check --workspace

      # On Windows, exclude crates that require whisper.cpp C++ compilation
      # (voxctrl-inference, voxctrl-app). Their Rust type-safety is covered by
      # the Linux check above; this job validates Windows-specific platform code
      # in the remaining pure-Rust crates.
      - name: cargo check (workspace excluding C++ crates, Windows)
        if: runner.os == 'Windows'
        run: cargo check --workspace --exclude voxctrl-inference --exclude voxctrl-app

  # ── Unit tests ────────────────────────────────────────────────────────────────
  cargo-test:
    name: cargo test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libasound2-dev \
            libspeechd-dev \
            libxdo-dev \
            patchelf \
            squashfs-tools \
            pkg-config \
            build-essential \
            espeak-ng \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-linux

      # Run tests for crates that have unit tests and no heavy system deps.
      # voxctrl-tts's phoneme-frontend tests exercise the real `espeak-ng`
      # binary when it is present, and skip cleanly when it isn't — it is
      # installed above so they actually run here.
      #
      # Under xvfb-run for the same reason: the X11 hotkey backend's tests talk
      # to a real X server when DISPLAY is set, and skip when it isn't. Only a
      # real server rejects a malformed XISelectEvents request, and a version
      # of that backend shipped selecting raw and hierarchy events in one mask
      # — which every server refuses, so no key ever arrived — with the whole
      # suite passing. Without a display here those tests silently skip and the
      # gap reopens.
      - name: cargo test
        run: xvfb-run -a cargo test -p voxctrl-config -p voxctrl-routing -p voxctrl-hotkeys -p voxctrl-tts -p voxctrl-app

  # ── Frontend type check ───────────────────────────────────────────────────────
  frontend-check:
    name: Frontend type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm install

      # svelte-check (Svelte + TypeScript type checking)
      - run: npm run check

      # Frontend unit tests (vitest)
      - run: npm run test:unit
